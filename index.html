<!doctype html>
<!--
  index.html — アプリの入口になるページ
  ブラウザはまずこのファイルを開き、下の script から src/main.jsx を読み込む。
  中身の画面は React が <div id="root"> の中に描く。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- viewport：スマホで文字が小さくならないよう、画面の幅に合わせて表示させる指定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tackle-lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
